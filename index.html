<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Le shell de Kevin Ambiehl</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout : une seule fenêtre de terminal, posée sur un fond cuir sombre. Look volontairement unique (sombre). */
:root {
  --leather: #16120f;      /* fond de page, cuir très foncé */
  --window: #1f1915;       /* fenêtre du terminal */
  --bar: #2a221c;          /* barre de titre */
  --ink: #e9dfcf;          /* texte principal */
  --muted: #9a8b78;        /* texte secondaire */
  --amber: #e3a84f;        /* accent : prompt, titres */
  --sage: #a9bd8f;         /* commandes, liens */
  --rose: #d98a7a;         /* erreurs */
  --ps: #8fb6dc;           /* prompt du mode PowerShell */
  --line: #3a2f27;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-label: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--leather); }
body {
  background: var(--leather);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 14.5px;
  line-height: 1.6;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.window {
  max-width: 900px;
  margin: 0 auto;
  background: var(--window);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 24px 60px -30px rgba(0,0,0,.8);
}
.titlebar {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  background: var(--bar);
  border-bottom: 1px solid var(--line);
  font-family: var(--font-label);
  font-size: 13px; letter-spacing: .04em;
  color: var(--muted);
}
.stitch { /* points de couture, clin d'œil à la maroquinerie */
  flex: 0 0 auto; width: 46px; height: 2px;
  background-image: linear-gradient(90deg, var(--amber) 55%, transparent 55%);
  background-size: 8px 2px; opacity: .7;
}
.titlebar strong { color: var(--ink); font-weight: 600; }
.titlebar .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screen { padding: 18px 20px 8px; min-width: 0; }
#out { min-width: 0; }
.block { margin: 0 0 14px; }
.line { white-space: pre-wrap; word-break: break-word; }
.cmdline .ps1 { color: var(--amber); }
.cmdline .typed { color: var(--sage); }
.h { color: var(--amber); font-weight: 600; }
.k { color: var(--sage); }
.m { color: var(--muted); }
.err { color: var(--rose); }
.ascii { color: var(--amber); white-space: pre; overflow-x: auto; font-size: 12px; line-height: 1.25; }
.grid { display: grid; grid-template-columns: max-content 1fr; gap: 2px 18px; }
.grid > * { min-width: 0; }
.entry { margin: 0 0 10px; }
.entry .when { color: var(--muted); font-variant-numeric: tabular-nums; }
ul.dash { list-style: none; margin: 2px 0 0; padding: 0; }
ul.dash li { padding-left: 2ch; text-indent: -2ch; }
ul.dash li::before { content: "- "; color: var(--muted); }
a.cmd, button.cmd {
  font: inherit; color: var(--sage); background: none; border: 0; padding: 0;
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px;
  cursor: pointer;
}
a.cmd:hover, button.cmd:hover { text-decoration-color: var(--sage); }
.copy {
  font: 500 12px var(--font-label); letter-spacing: .04em;
  color: var(--ink); background: var(--bar); border: 1px solid var(--line);
  border-radius: 4px; padding: 1px 8px; margin-left: 8px; cursor: pointer;
}
.copy:hover { border-color: var(--amber); }
.sel { user-select: all; }
.prompt {
  display: flex; align-items: baseline; gap: 1ch;
  padding: 4px 0 14px;
}
.prompt .ps1 { color: var(--amber); white-space: nowrap; }
#in {
  flex: 1; min-width: 0;
  font: inherit; color: var(--sage);
  background: transparent; border: 0; outline: none;
  caret-color: var(--amber); padding: 0;
}
.chips {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--line);
  background: var(--bar);
}
.chips .label {
  width: 100%; font: 600 11px var(--font-label);
  text-transform: uppercase; letter-spacing: .1em; color: var(--muted);
}
.chips button {
  font: 500 13px var(--font-mono); color: var(--ink);
  background: var(--window); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 12px; cursor: pointer;
}
.chips button:hover { border-color: var(--amber); color: var(--amber); }
button:focus-visible, #in:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.foot { max-width: 900px; margin: 14px auto 0; color: var(--muted); font-size: 12px; font-family: var(--font-label); letter-spacing: .03em; }
.ps-mode .prompt .ps1, .cmdline .ps1.psh { color: var(--ps); }
.ps-mode .stitch { background-image: linear-gradient(90deg, var(--ps) 55%, transparent 55%); }
.ok { color: var(--sage); }
.tk { border-left: 2px solid var(--line); padding-left: 12px; margin-top: 4px; }
.tk .step { display: block; }
.trophy { color: var(--amber); }
.q { margin-top: 10px; }
.choices { display: grid; gap: 6px; margin: 6px 0 4px; }
.choice {
  font: inherit; text-align: left; color: var(--ink);
  background: var(--bar); border: 1px solid var(--line); border-radius: 6px;
  padding: 6px 10px; cursor: pointer;
}
.choice:hover:not(:disabled) { border-color: var(--amber); }
.choice:disabled { cursor: default; opacity: .55; }
.choice.wrong { border-color: var(--rose); text-decoration: line-through; text-decoration-color: var(--rose); }
.choice.right { border-color: var(--sage); opacity: 1; }
@media (prefers-reduced-motion: no-preference) {
  .tk .step { animation: rise .25s ease-out backwards; }
  .tk .step:nth-child(2) { animation-delay: .25s; }
  .tk .step:nth-child(3) { animation-delay: .5s; }
  .tk .step:nth-child(4) { animation-delay: .75s; }
  .tk .step:nth-child(5) { animation-delay: 1s; }
  .tk .step:nth-child(6) { animation-delay: 1.25s; }
}
@media (max-width: 520px) {
  body { font-size: 13.5px; }
  .screen { padding: 14px 14px 6px; }
  .chips { padding: 12px 14px 14px; }
  .grid { grid-template-columns: 1fr; gap: 0; }
  .grid > :nth-child(odd) { margin-top: 6px; }
  .prompt .ps1 .host { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .block.fresh { animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: .3; transform: translateY(3px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<main class="window" aria-label="Terminal interactif présentant le CV de Kevin Ambiehl">
  <div class="titlebar">
    <span class="stitch" aria-hidden="true"></span>
    <span class="grow" id="wtitle"><strong>kevsh</strong> · kevin@artignosc : ~</span>
    <span id="wshell">bash 42</span>
  </div>
  <div class="screen" id="screen">
    <div id="out" aria-live="polite"></div>
    <form class="prompt" id="form" autocomplete="off">
      <label for="in" class="ps1" id="ps1label"><span class="host">kevin@artignosc</span>:~$</label>
      <input id="in" name="in" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" aria-label="Tapez une commande, par exemple help">
    </form>
  </div>
  <div class="chips" id="chips">
    <span class="label">Pas envie de taper ? Cliquez</span>
  </div>
</main>
<p class="foot">Tab pour compléter · ↑ ↓ pour l'historique · <span class="k">clear</span> pour nettoyer l'écran<br>Concept et contenu : Kevin Ambiehl · code réalisé avec l'aide d'une IA (Claude) · tapez <span class="k">credits</span></p>

  C.history = function () {
    if (!hist.length) return '<span class="m">Historique vide.</span>';
    return hist.map(function (h, i) { return '<span class="m">' + String(i + 1).padStart(4, ' ') + '</span>  ' + cmd(h); }).join('\n');
  };
  C.norminette = function () { return 'kevin.c: <span class="k">OK!</span>'; };
  C.sudo = function () { return '<span class="err">kevin n\'apparaît pas dans le fichier sudoers. Cet incident sera signalé…</span> au N2, comme il se doit.'; };
  C.pwd = function () { return '/home/kevin'; };
  C.date = function () { return new Date().toLocaleString('fr-FR', { dateStyle: 'full', timeStyle: 'short' }); };
  C.make = function () { return 'make: Rien à faire pour « candidature ». Elle est déjà envoyée.'; };
  C.exit = function () {
    if (mode === 'ps') { setMode('bash'); return '<span class="m">Retour à bash. Tapez</span> ' + cmd('help') + ' <span class="m">pour la liste des commandes.</span>'; }
    return '<span class="m">On ne quitte pas un terminal aussi facilement. Essayez plutôt</span> ' + cmd('contact') + '.'; };

  var OPT = {
    c: 'competences', competences: 'competences', competence: 'competences',
    e: 'experience', experience: 'experience', experiences: 'experience',
    f: 'formation', formation: 'formation',
    p: 'projets', projets: 'projets', projet: 'projets',
    contact: 'contact',
    telework: function () { return '<span class="k">--telework</span> : activé. Disponible en télétravail 100 %, depuis le Var.'; },
    microsoft365: function () { return '<span class="k">--microsoft365</span> : module en cours de chargement (AB-900 en préparation).'; },
    'patience-client': function () { return '<span class="k">--patience-client</span> : valeur actuelle <span class="h">infinie</span>. Dix ans de marchés et de foires.'; }
  };
  function kevinArgs(args) {
    var parts = [];
    args.split(' ').forEach(function (a) {
      if (/^-[a-z]{2,}$/.test(a) && a.slice(1).split('').every(function (l) { return OPT[l]; })) {
        a.slice(1).split('').forEach(function (l) { parts.push('-' + l); });
      } else parts.push(a);
    });
    return parts.map(function (a) {
      if (a.charAt(0) !== '-') return '<span class="err">kevin : argument inattendu « ' + esc(a) + ' »</span> · les options commencent par un tiret, par exemple ' + cmd('man kevin -c');
      var key = a.replace(/^-+/, '').split('=')[0];
      var o = OPT[key];
      if (!o) return '<span class="err">kevin : option invalide -- « ' + esc(key) + ' »</span> · voir ' + cmd('man kevin');
      return typeof o === 'function' ? o() : C[o]();
    }).join('<div style="height:12px"></div>');
  }

  var ALIASES = { aide: 'help', '?': 'help', skills: 'competences', 'compétences': 'competences', experiences: 'experience', 'expérience': 'experience', projects: 'projets', about: 'profil', 'man': 'man kevin', 'cd': 'pwd' };
  var NAMES = Object.keys(C).concat(Object.keys(FILES).map(function (f) { return 'cat ' + f; }));

  function resolve(raw) {
    var s = raw.trim().replace(/\s+/g, ' ');
    var low = s.toLowerCase();
    if (C[low]) return C[low];
    if (ALIASES[low]) return C[ALIASES[low]];
    if (/^sudo\b/.test(low)) return C.sudo;
    if (/^cd\b/.test(low)) return function () { return '<span class="m">Vous êtes déjà au bon endroit.</span>'; };
    if (/^rm\b/.test(low)) return function () { return '<span class="err">rm : opération refusée.</span> Ce CV ne se supprime pas.'; };
    var tkm = low.match(/^(?:ticket|get-ticket)\s+(.+)$/);
    if (tkm) {
      var qcm = /(^|\s)-{0,2}qcm(\s|$)/.test(tkm[1]);
      var sol = /(\s|^)(--solution|-s)$/.test(tkm[1]);
      var arg = tkm[1].replace(/(^|\s)-{0,2}qcm(\s|$)/, ' ').replace(/(\s|^)(--solution|-s)$/, '').replace(/^-id\s+/, '').replace(/^#?n1-04/, '').trim();
      if (/^(--list|-l|list|--all)$/.test(arg)) return ticketList;
      if (!arg) return qcm ? C['ticket qcm'] : C.ticket;
      var num = parseInt(arg, 10);
      if (num >= 21 && num <= 20 + TICKETS.length) num -= 20;
      if (num >= 1 && num <= TICKETS.length) return function () { if (qcm && !sol) return playTicket(num - 1); if (game && game.i === num - 1) game = null; return showTicket(num - 1); };
      return function () { return '<span class="err">ticket : « ' + esc(tkm[1]) + ' » introuvable</span> · voir ' + cmd('ticket --list'); };
    }
    var km = low.match(/^(?:man )?kevin(?: (.+))?$/);
    if (km) {
      if (!km[1]) return C['man kevin'];
      return function () { return kevinArgs(km[1]); };
    }
    if (low === 'cat cv_kevin_ambiehl.pdf' || low === 'open cv_kevin_ambiehl.pdf' || low === 'start cv_kevin_ambiehl.pdf') return function () { return (low.indexOf('cat') === 0 ? '<span class="m">%PDF-1.4 … c\'est un fichier binaire, il se lit mieux ouvert :</span> ' : 'Ouverture : ') + pdfLink(); };
    if (low === 'lettre' || low === 'lettre de motivation') return C.motivation;
    if (low === 'ls trophees' || low === 'cd trophees' || low === 'cd trophees/') return C['ls trophees/'];
    if (/^make (le )?pain$/.test(low)) return C['make pain'];
    if (mode === 'ps' && (low === 'help' || low === 'get-help kevin')) return C['get-help'];
    var tm = low.match(/^(?:cat|get-content) (?:trophees\/)?(20(?:24|25|26))_champion_du_monde\.txt$/);
    if (tm) return function () { return trophy(tm[1]); };
    var m = low.match(/^(?:cat|get-content) (.+)$/);
    if (m) {
      var f = m[1].trim();
      if (FILES[f]) return C[FILES[f]];
      return function () { return '<span class="err">cat: ' + esc(f) + ': Aucun fichier ou dossier de ce type</span> · essayez ' + cmd('ls'); };
    }
    if (/^man .+/.test(low)) return function () { return '<span class="err">Aucune entrée de manuel pour ' + esc(s.slice(4)) + '</span> · essayez ' + cmd('man kevin') + ' ou ' + cmd('man 42'); };
    return null;
  }

  function print(html, typed, pm) {
    pm = pm || mode;
    var b = document.createElement('div');
    b.className = 'block fresh';
    if (typed !== undefined) {
      var l = document.createElement('div');
      l.className = 'line cmdline';
      l.innerHTML = pm === 'ps'
        ? '<span class="ps1 psh">' + esc(PS1_PS) + '</span> <span class="typed">' + esc(typed) + '</span>'
        : '<span class="ps1">' + PS1 + '</span> <span class="typed">' + esc(typed) + '</span>';
      b.appendChild(l);
    }
    if (html) {
      var o = document.createElement('div');
      o.className = 'line';
      o.innerHTML = html;
      b.appendChild(o);
    }
    out.appendChild(b);
    return b;
  }

  function run(raw, opts) {
    opts = opts || {};
    var s = raw.trim();
    if (!s) { print('', ''); return; }
    if (!opts.silent) { hist.push(s); hIdx = hist.length; }
    if (game && /^[1-3]$/.test(s)) { choose(parseInt(s, 10) - 1); return; }
    var lowS = s.toLowerCase();
    if (lowS === 'clear' || lowS === 'cls' || lowS === 'clear-host') { out.innerHTML = ''; return; }
    var startMode = mode;
    var fn = resolve(s);
    var notFound = mode === 'ps'
      ? '<span class="err">' + esc(s) + ' : le terme « ' + esc(s.split(' ')[0]) + ' » n\'est pas reconnu comme nom d\'applet de commande.</span>\nVérifiez l\'orthographe, ou tapez ' + cmd('Get-Help') + '.'
      : '';
    if (mode !== 'ps') {
      notFound = /^(get|set|clear|new)-/i.test(s)
        ? '<span class="err">kevsh: ' + esc(s) + ' : commande introuvable.</span> On dirait du PowerShell : tapez ' + cmd('pwsh') + ' pour changer de shell.'
        : '<span class="err">kevsh: commande introuvable : ' + esc(s) + '</span> · tapez ' + cmd('help');
    }
    var b = print(fn ? fn() : notFound, s, startMode);
    if (!opts.noScroll) {
      try { b.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); } catch (e) { b.scrollIntoView(); }
    }
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = input.value;
    input.value = '';
    run(v);
  });

  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      var val = input.value;
      input.value = '';
      run(val);
      return;
    }
    if (e.key === 'ArrowUp') {
      if (hist.length) { hIdx = Math.max(0, hIdx - 1); input.value = hist[hIdx]; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      if (hist.length) { hIdx = Math.min(hist.length, hIdx + 1); input.value = hist[hIdx] || ''; }
      e.preventDefault();
    } else if (e.key === 'Tab') {
      var v = input.value.toLowerCase();
      if (!v) return;
      e.preventDefault();
      var hits = NAMES.filter(function (n) { return n.indexOf(v) === 0; });
      if (hits.length === 1) input.value = hits[0];
      else if (hits.length > 1) print(hits.map(function (h) { return cmd(h); }).join('   '));
    } else if (e.key === 'l' && e.ctrlKey) {
      e.preventDefault(); out.innerHTML = '';
    }
  });

  document.addEventListener('click', function (e) {
    var ch = e.target.closest('[data-choice]');
    if (ch) {
      var parts = ch.getAttribute('data-choice').split(':');
      if (game && +parts[0] === game.gid) choose(+parts[1]);
      input.focus({ preventScroll: true });
      return;
    }
    var t = e.target.closest('[data-run]');
    if (t) { run(t.getAttribute('data-run')); input.focus({ preventScroll: true }); return; }
    var c = e.target.closest('[data-copy]');
    if (c) {
      var text = c.getAttribute('data-copy');
      var done = function () { c.textContent = 'Copié'; setTimeout(function () { c.textContent = 'Copier'; }, 1600); };
      var fallback = function () {
        var sel = c.previousElementSibling;
        if (sel) { var r = document.createRange(); r.selectNodeContents(sel); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
        c.textContent = 'Sélectionné';
        setTimeout(function () { c.textContent = 'Copier'; }, 1600);
      };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
      return;
    }
    if (e.target.closest('.screen') && !getSelection().toString()) input.focus({ preventScroll: true });
  });

  var chips = document.getElementById('chips');
  ['whoami', 'competences', 'experience', 'projets', 'ticket', 'ticket qcm', 'pwsh', 'man 42', 'paume', 'contact', 'motivation', 'pdf', 'clear'].forEach(function (c) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = c; b.setAttribute('data-run', c);
    chips.appendChild(b);
  });

  // Écran d'accueil : visible dès le chargement
  print('<div class="ascii" aria-hidden="true">' +
    '┌──────────────────────────────────┐\n' +
    '│  kevsh 1.0 · Kevin Ambiehl       │\n' +
    '│  support informatique · N1       │\n' +
    '└──────────────────────────────────┘' +
    '</div><span class="m">Le CV de Kevin Ambiehl, en ligne de commande.</span>');
  run('whoami', { silent: true, noScroll: true });
  run('help', { silent: true, noScroll: true });
})();
</script>
